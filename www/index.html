<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a2830">
<title>空气古筝 · Air Guzheng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e1a22;
  --mist:#1a2830;
  --jade:#3d7a6a;
  --jade-lit:#5a9e88;
  --wood:#5c3420;
  --wood-mid:#8b5a34;
  --wood-lit:#c4894a;
  --silk:#e8d4a8;
  --silk-dim:#a89068;
  --glow:#f0c878;
  --note:#f5e6c8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  font-family:"Noto Serif SC","Songti SC","STSong",serif;background:var(--ink);color:var(--silk)}
body{
  background:
    radial-gradient(ellipse 90% 60% at 50% 110%,rgba(92,52,32,.45),transparent 55%),
    radial-gradient(ellipse 70% 50% at 20% 20%,rgba(61,122,106,.18),transparent 50%),
    radial-gradient(ellipse 50% 40% at 85% 15%,rgba(240,200,120,.08),transparent 45%),
    linear-gradient(165deg,#0a141c 0%,#152028 40%,#1a2830 70%,#121c24 100%);
}

/* grain texture */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.07;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

#stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column}
#brand-bar{flex:0 0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 4px;text-align:center;pointer-events:none}
#brand-bar h1{font-family:"Ma Shan Zheng","Noto Serif SC",serif;font-size:clamp(28px,7vw,48px);font-weight:400;
  letter-spacing:.12em;color:var(--glow);text-shadow:0 2px 24px rgba(240,200,120,.25);line-height:1.1}
#brand-bar .en{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--silk-dim);margin-top:2px;opacity:.7}

#hud{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
  padding:4px 14px 6px;pointer-events:none;gap:8px}
#note-display{font-family:"Ma Shan Zheng",serif;font-size:clamp(22px,5vw,36px);color:var(--glow);
  min-height:1.2em;opacity:0;transition:opacity .15s;text-shadow:0 0 20px rgba(240,200,120,.35)}
#note-display.show{opacity:1}
#note-sub{font-size:11px;color:var(--silk-dim);letter-spacing:.15em}
#mode-hint{font-size:10px;color:var(--jade-lit);opacity:.75;text-align:right;line-height:1.4}

#guzheng-wrap{flex:1;position:relative;min-height:0;margin:0 8px 8px;display:flex;align-items:center;justify-content:center}
#guzheng{position:relative;width:min(96vw,720px);height:min(58vh,340px);border-radius:8px 48px 48px 8px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.25) 0%,transparent 8%,transparent 92%,rgba(0,0,0,.2) 100%),
    linear-gradient(180deg,#6e3e22 0%,#8b5a34 18%,#a07040 45%,#8b5a34 72%,#5c3420 100%);
  box-shadow:
    0 12px 40px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(232,212,168,.2),
    inset 0 -2px 8px rgba(0,0,0,.35);
  overflow:hidden}
#guzheng::before{content:"";position:absolute;left:6%;top:8%;bottom:8%;width:3%;
  background:linear-gradient(90deg,#4a2814,#7a4a28,#4a2814);border-radius:2px;opacity:.9}
#guzheng::after{content:"";position:absolute;right:4%;top:10%;bottom:10%;width:8%;
  background:radial-gradient(ellipse at 40% 50%,#3a2010 0%,#5c3420 60%,#8b5a34 100%);
  border-radius:40% 50% 50% 40%;box-shadow:inset 2px 0 6px rgba(0,0,0,.4)}

#strings{position:absolute;inset:10% 14% 10% 12%;display:flex;flex-direction:column;justify-content:space-between}
.string{position:relative;height:2px;flex-shrink:0;cursor:pointer;
  background:linear-gradient(90deg,transparent,#d4c090 4%,#f0e0b8 50%,#d4c090 96%,transparent);
  box-shadow:0 0 1px rgba(240,224,184,.5);transform-origin:center;touch-action:none}
.string::before{content:"";position:absolute;left:-10px;top:50%;width:6px;height:6px;margin-top:-3px;
  border-radius:50%;background:#c8a060;box-shadow:0 0 3px rgba(0,0,0,.4)}
.string.highlighted{background:linear-gradient(90deg,transparent,#f0c878 4%,#fff4d0 50%,#f0c878 96%,transparent);
  box-shadow:0 0 8px rgba(240,200,120,.7);height:3px}
.string.plucked{animation:vibrate .45s ease-out}
@keyframes vibrate{
  0%{transform:scaleY(1) translateY(0)}
  10%{transform:scaleY(3.5) translateY(-2px)}
  25%{transform:scaleY(2.2) translateY(1.5px)}
  40%{transform:scaleY(2.8) translateY(-1px)}
  60%{transform:scaleY(1.6) translateY(.5px)}
  100%{transform:scaleY(1) translateY(0)}
}
.string .label{position:absolute;right:-28px;top:50%;transform:translateY(-50%);
  font-size:8px;color:var(--silk-dim);opacity:0;pointer-events:none;width:24px;text-align:left}
.string.highlighted .label,.string.plucked .label{opacity:1;color:var(--glow)}

#bridge-dots{position:absolute;left:55%;top:10%;bottom:10%;width:2px;pointer-events:none}
.bridge-dot{position:absolute;left:50%;width:7px;height:5px;margin-left:-3.5px;
  background:linear-gradient(180deg,#e8d4a8,#8b5a34);border-radius:1px 1px 40% 40%;
  box-shadow:0 1px 2px rgba(0,0,0,.4)}

#ring-status,#cane-status{position:fixed;right:8px;font-size:10px;padding:3px 8px;border-radius:12px;
  z-index:50;display:none;background:rgba(14,26,34,.85);color:var(--silk-dim);border:1px solid rgba(168,144,104,.35);
  font-family:"Noto Serif SC",serif;backdrop-filter:blur(6px)}
#ring-status{top:calc(52px + env(safe-area-inset-top))}
#cane-status{top:calc(78px + env(safe-area-inset-top))}
#ring-status.active{display:flex;align-items:center;gap:4px;color:#7eb8a8;border-color:rgba(90,158,136,.5)}
#cane-status.active{display:flex;align-items:center;gap:4px;color:#c8a060;border-color:rgba(200,160,96,.5)}
#ring-status.tap,#cane-status.tap{cursor:pointer;display:flex}

/* onboarding */
#onboard{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;text-align:center;
  background:
    radial-gradient(ellipse 80% 50% at 50% 80%,rgba(92,52,32,.5),transparent 60%),
    radial-gradient(ellipse 60% 40% at 30% 20%,rgba(61,122,106,.2),transparent),
    rgba(8,14,18,.94);backdrop-filter:blur(8px)}
#onboard.hidden{display:none}
#onboard .mark{font-family:"Ma Shan Zheng",serif;font-size:clamp(48px,14vw,88px);color:var(--glow);
  letter-spacing:.08em;line-height:1;margin-bottom:4px;
  animation:brandIn 1.1s cubic-bezier(.22,1,.36,1) both}
#onboard .tag{font-size:12px;letter-spacing:.4em;color:var(--silk-dim);margin-bottom:28px;
  animation:fadeUp .8s .2s both}
#onboard .lead{font-size:15px;color:var(--silk);max-width:320px;line-height:1.7;margin-bottom:22px;
  animation:fadeUp .8s .35s both}
#onboard .controls{display:flex;flex-direction:column;gap:8px;margin-bottom:28px;max-width:300px;width:100%;
  animation:fadeUp .8s .45s both}
.ctrl{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:8px 12px;
  background:rgba(26,40,48,.6);border:1px solid rgba(168,144,104,.2);border-radius:6px}
.ctrl .ico{font-size:16px;width:24px;text-align:center;flex-shrink:0;line-height:1.4}
.ctrl .txt{font-size:12px;line-height:1.45;color:var(--silk-dim)}
.ctrl .txt b{color:var(--silk);font-weight:600}
#start-btn{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:600;letter-spacing:.2em;
  padding:14px 40px;border:none;border-radius:4px;cursor:pointer;color:#1a1208;
  background:linear-gradient(135deg,#e8d4a8,#c4894a 50%,#a07040);
  box-shadow:0 4px 24px rgba(196,137,74,.35);animation:fadeUp .8s .55s both;transition:transform .15s}
#start-btn:active{transform:scale(.96)}
@keyframes brandIn{from{opacity:0;transform:translateY(16px) scale(.96);letter-spacing:.3em}
  to{opacity:1;transform:none;letter-spacing:.08em}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* watch */
@media(max-width:280px),(max-height:300px){
  #brand-bar{padding:4px 6px 0}#brand-bar h1{font-size:16px;letter-spacing:.06em}
  #brand-bar .en{font-size:6px;letter-spacing:.2em}
  #hud{padding:2px 6px}#note-display{font-size:14px}#note-sub{font-size:7px}#mode-hint{font-size:7px;display:none}
  #guzheng-wrap{margin:0 2px 4px}
  #guzheng{height:min(70vh,200px);border-radius:4px 20px 20px 4px}
  #strings{inset:8% 10% 8% 10%}.string .label{display:none}
  #ring-status,#cane-status{font-size:7px;padding:2px 5px;right:4px}
  #ring-status{top:28px}#cane-status{top:44px}
  #onboard{padding:10px}#onboard .mark{font-size:28px}#onboard .tag{font-size:8px;margin-bottom:10px}
  #onboard .lead{font-size:10px;margin-bottom:10px}#onboard .controls{gap:4px;margin-bottom:12px}
  .ctrl{padding:4px 6px}.ctrl .ico{font-size:11px;width:16px}.ctrl .txt{font-size:8px}
  #start-btn{font-size:11px;padding:8px 18px;letter-spacing:.12em}
}
@media(max-width:420px) and (max-height:340px),(max-width:340px) and (max-height:420px){
  #brand-bar h1{font-size:20px}#note-display{font-size:18px}
  #guzheng{height:min(65vh,220px)}
  #onboard .mark{font-size:36px}.ctrl .txt{font-size:10px}#start-btn{font-size:13px;padding:10px 24px}
}
</style>
</head>
<body>
<div id="onboard">
  <div class="mark">空气古筝</div>
  <div class="tag">AIR GUZHENG</div>
  <p class="lead">在空气中拨动虚弦——触屏轻抚，或借智能戒指与手杖，奏一曲丝桐之音。</p>
  <div class="controls">
    <div class="ctrl"><span class="ico">✋</span><div class="txt"><b>触屏</b>：点按或滑过琴弦即可发声，支持多指同奏</div></div>
    <div class="ctrl"><span class="ico">💍</span><div class="txt"><b>智能戒指</b>：左右倾斜选弦（拨弦用手/手杖）</div></div>
    <div class="ctrl"><span class="ico">🦯</span><div class="txt"><b>智能手杖</b>：轻敲拨弦，左右摆动换弦</div></div>
  </div>
  <button id="start-btn" type="button">启 奏</button>
</div>

<div id="stage">
  <div id="brand-bar">
    <h1>空气古筝</h1>
    <div class="en">Air Guzheng</div>
  </div>
  <div id="hud">
    <div>
      <div id="note-display">—</div>
      <div id="note-sub">宫商角徵羽</div>
    </div>
    <div id="mode-hint">触弦即鸣 · 滑奏连音</div>
  </div>
  <div id="guzheng-wrap">
    <div id="guzheng">
      <div id="bridge-dots"></div>
      <div id="strings"></div>
    </div>
  </div>
</div>

<div id="ring-status"></div>
<div id="cane-status"></div>

<script>
/* ===== Tuning: 21-string guzheng, D major pentatonic D3–D6 ===== */
const PENT = [
  {freq:146.83, name:'D3', jian:'1', solfa:'宫'},
  {freq:164.81, name:'E3', jian:'2', solfa:'商'},
  {freq:185.00, name:'F#3', jian:'3', solfa:'角'},
  {freq:220.00, name:'A3', jian:'5', solfa:'徵'},
  {freq:246.94, name:'B3', jian:'6', solfa:'羽'},
  {freq:293.66, name:'D4', jian:'1̇', solfa:'宫'},
  {freq:329.63, name:'E4', jian:'2̇', solfa:'商'},
  {freq:369.99, name:'F#4', jian:'3̇', solfa:'角'},
  {freq:440.00, name:'A4', jian:'5̇', solfa:'徵'},
  {freq:493.88, name:'B4', jian:'6̇', solfa:'羽'},
  {freq:587.33, name:'D5', jian:'1̈', solfa:'宫'},
  {freq:659.25, name:'E5', jian:'2̈', solfa:'商'},
  {freq:739.99, name:'F#5', jian:'3̈', solfa:'角'},
  {freq:880.00, name:'A5', jian:'5̈', solfa:'徵'},
  {freq:987.77, name:'B5', jian:'6̈', solfa:'羽'},
  {freq:1174.66, name:'D6', jian:'1⃛', solfa:'宫'},
  {freq:1318.51, name:'E6', jian:'2⃛', solfa:'商'},
  {freq:1479.98, name:'F#6', jian:'3⃛', solfa:'角'},
  {freq:1760.00, name:'A6', jian:'5⃛', solfa:'徵'},
  {freq:1975.53, name:'B6', jian:'6⃛', solfa:'羽'},
  {freq:2349.32, name:'D7', jian:'1⃜', solfa:'宫'},
];

let aCtx = null, masterGain = null;
let selectedIdx = 10;
let lastPluck = Object.create(null);
let noteHideTimer = null;
let playing = false;
/** @type {Record<string, {delay: DelayNode, oscs: OscillatorNode[], baseFreq: number}>} */
let liveStrings = Object.create(null);
const touchMeta = new Map(); // pointerId → { idx, x0, t0, bending }

const stringsEl = document.getElementById('strings');
const bridgeEl = document.getElementById('bridge-dots');
const noteDisplay = document.getElementById('note-display');
const stringEls = [];

function buildUI() {
  stringsEl.innerHTML = '';
  bridgeEl.innerHTML = '';
  stringEls.length = 0;
  for (let i = 0; i < PENT.length; i++) {
    const s = document.createElement('div');
    s.className = 'string';
    s.dataset.idx = i;
    const lab = document.createElement('span');
    lab.className = 'label';
    lab.textContent = PENT[i].jian;
    s.appendChild(lab);
    stringsEl.appendChild(s);
    stringEls.push(s);

    const d = document.createElement('div');
    d.className = 'bridge-dot';
    d.style.top = ((i + 0.5) / PENT.length * 100) + '%';
    /* bridges shift right for higher strings (guzheng look) */
    d.style.left = (20 + (i / (PENT.length - 1)) * 55) + '%';
    bridgeEl.appendChild(d);
  }
  highlightSelected();
}

function ensureAudio() {
  if (aCtx) {
    if (aCtx.state === 'suspended') aCtx.resume();
    return;
  }
  aCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = aCtx.createGain();
  masterGain.gain.value = 0.55;
  const comp = aCtx.createDynamicsCompressor();
  comp.threshold.value = -18;
  comp.knee.value = 12;
  comp.ratio.value = 3;
  comp.attack.value = 0.003;
  comp.release.value = 0.25;
  masterGain.connect(comp);
  comp.connect(aCtx.destination);
}

/* Karplus-Strong–inspired plucked string */
function pluckString(idx, velocity) {
  if (idx < 0 || idx >= PENT.length) return;
  ensureAudio();
  const now = aCtx.currentTime;
  const key = 's' + idx;
  // Tremolo: allow rapid re-pluck of same string (tight window)
  const tremolo = lastPluck[key] && now - lastPluck[key] < 0.14;
  if (lastPluck[key] && now - lastPluck[key] < 0.04 && !tremolo) return;
  lastPluck[key] = now;

  const note = PENT[idx];
  const freq = note.freq;
  const vel = Math.max(0.25, Math.min(1, velocity || 0.7));
  const dur = 2.2 + (1 - idx / PENT.length) * 1.8;

  const bufLen = Math.max(2, Math.floor(aCtx.sampleRate / freq));
  const buf = aCtx.createBuffer(1, bufLen, aCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * vel;

  const noise = aCtx.createBufferSource();
  noise.buffer = buf;

  const bp = aCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = freq;
  bp.Q.value = 1.2;

  const delay = aCtx.createDelay(1);
  delay.delayTime.value = 1 / freq;

  const feedback = aCtx.createGain();
  feedback.gain.value = 0.96 - idx * 0.002;

  const damp = aCtx.createBiquadFilter();
  damp.type = 'lowpass';
  damp.frequency.value = Math.min(6000, freq * 6);
  damp.Q.value = 0.5;

  const env = aCtx.createGain();
  env.gain.setValueAtTime(0.0001, now);
  env.gain.exponentialRampToValueAtTime(0.35 * vel, now + 0.008);
  env.gain.exponentialRampToValueAtTime(0.0001, now + dur);

  const partials = [1, 2, 3.01, 4.98];
  const gains = [0.22, 0.1, 0.04, 0.02].map(g => g * vel);
  const oscs = [];
  partials.forEach((mul, pi) => {
    const osc = aCtx.createOscillator();
    osc.type = 'sine';
    osc._mul = mul;
    osc.frequency.value = freq * mul;
    const g = aCtx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(gains[pi], now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur * (0.4 + pi * 0.1));
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + dur);
    oscs.push(osc);
  });

  noise.connect(bp);
  bp.connect(delay);
  delay.connect(damp);
  damp.connect(feedback);
  feedback.connect(delay);
  delay.connect(env);
  env.connect(masterGain);

  noise.start(now);
  noise.stop(now + 0.04);

  liveStrings[key] = { delay, oscs, baseFreq: freq };
  setTimeout(() => {
    if (liveStrings[key] && liveStrings[key].delay === delay) delete liveStrings[key];
  }, dur * 1000);

  const el = stringEls[idx];
  if (el) {
    el.classList.remove('plucked');
    void el.offsetWidth;
    el.classList.add('plucked');
    setTimeout(() => el.classList.remove('plucked'), 450);
  }
  showNote(note);
}

/** Left-hand press: pitch bend in semitones (−2..+3). */
function bendString(idx, semis) {
  const live = liveStrings['s' + idx];
  if (!live || !aCtx) return;
  const f = live.baseFreq * Math.pow(2, Math.max(-2, Math.min(3, semis)) / 12);
  const now = aCtx.currentTime;
  live.delay.delayTime.setTargetAtTime(1 / f, now, 0.03);
  for (const osc of live.oscs) {
    try {
      osc.frequency.setTargetAtTime(f * (osc._mul || 1), now, 0.03);
    } catch (_) {}
  }
}

function showNote(note) {
  noteDisplay.textContent = note.solfa + '  ' + note.jian;
  noteDisplay.classList.add('show');
  clearTimeout(noteHideTimer);
  noteHideTimer = setTimeout(() => noteDisplay.classList.remove('show'), 900);
}

function highlightSelected() {
  stringEls.forEach((el, i) => el.classList.toggle('highlighted', i === selectedIdx));
}

function moveSelect(delta) {
  selectedIdx = Math.max(0, Math.min(PENT.length - 1, selectedIdx + delta));
  highlightSelected();
}

function pluckSelected(vel) {
  pluckString(selectedIdx, vel);
}

/* ===== Touch / pointer ===== */
const activeTouches = new Map(); /* touchId -> last string idx */

function stringIndexFromY(clientY) {
  const rect = stringsEl.getBoundingClientRect();
  if (rect.height <= 0) return -1;
  const t = (clientY - rect.top) / rect.height;
  if (t < 0 || t > 1) return -1;
  return Math.min(PENT.length - 1, Math.max(0, Math.floor(t * PENT.length)));
}

function onPointerDown(e) {
  if (!playing) return;
  e.preventDefault();
  ensureAudio();
  const id = e.pointerId;
  const idx = stringIndexFromY(e.clientY);
  if (idx < 0) return;
  activeTouches.set(id, idx);
  touchMeta.set(id, { idx, x0: e.clientX, t0: performance.now(), bending: false });
  selectedIdx = idx;
  highlightSelected();
  pluckString(idx, 0.75);
  try { e.target.setPointerCapture(id); } catch (_) {}
}

function onPointerMove(e) {
  if (!playing || !activeTouches.has(e.pointerId)) return;
  e.preventDefault();
  const meta = touchMeta.get(e.pointerId);
  const idx = stringIndexFromY(e.clientY);
  if (idx < 0) return;
  const prev = activeTouches.get(e.pointerId);

  // Same string + horizontal drag after short hold → 按弦滑音
  if (meta && idx === meta.idx) {
    const held = performance.now() - meta.t0 > 100;
    const dx = e.clientX - meta.x0;
    if (held && Math.abs(dx) > 12) {
      meta.bending = true;
      bendString(idx, (dx / 80));
      return;
    }
  }

  if (idx !== prev && !(meta && meta.bending)) {
    activeTouches.set(e.pointerId, idx);
    if (meta) {
      meta.idx = idx;
      meta.x0 = e.clientX;
      meta.t0 = performance.now();
      meta.bending = false;
    }
    selectedIdx = idx;
    highlightSelected();
    const speed = Math.min(1, Math.abs(e.movementY || 8) / 20);
    pluckString(idx, 0.4 + speed * 0.5);
  }
}

function onPointerUp(e) {
  activeTouches.delete(e.pointerId);
  touchMeta.delete(e.pointerId);
}

const guzheng = document.getElementById('guzheng');
guzheng.addEventListener('pointerdown', onPointerDown);
guzheng.addEventListener('pointermove', onPointerMove);
guzheng.addEventListener('pointerup', onPointerUp);
guzheng.addEventListener('pointercancel', onPointerUp);

/* keyboard fallback for desktop */
window.addEventListener('keydown', (e) => {
  if (!playing) return;
  if (e.key === 'ArrowUp') { e.preventDefault(); moveSelect(-1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); moveSelect(1); }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pluckSelected(0.8); }
});

/* ===== Smart Ring (DeviceOrientation) ===== */
let ringActive = false, ringFrame = 0, ringPrevBeta = null, ringPrevGamma = null;
let ringCooldown = 0;

function markRingConnected() {
  const b = document.getElementById('ring-status');
  ringActive = true;
  b.className = 'active';
  b.textContent = '💍 已连接';
  b.onclick = null;
  window.addEventListener('deviceorientation', handleRing);
}

function setupRing() {
  if (typeof DeviceOrientationEvent === 'undefined') return;
  if (ringActive) return;
  const b = document.getElementById('ring-status');
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    b.className = 'tap';
    b.textContent = '💍 点击启用';
    b.onclick = async () => {
      try {
        const p = await DeviceOrientationEvent.requestPermission();
        if (p === 'granted') markRingConnected();
      } catch (_) { b.textContent = '💍 不支持'; }
    };
  } else {
    markRingConnected();
  }
}

function handleRing(e) {
  if (!ringActive || !playing) return;
  ringFrame++;
  if (ringFrame % 8 !== 0) return;
  const beta = e.beta || 0;
  const gamma = e.gamma || 0;
  if (ringPrevBeta === null) {
    ringPrevBeta = beta;
    ringPrevGamma = gamma;
    return;
  }
  const dBeta = Math.abs(beta - ringPrevBeta);
  const dGamma = Math.abs(gamma - ringPrevGamma);
  const prevGamma = ringPrevGamma;
  ringPrevBeta = beta;
  ringPrevGamma = gamma;

  const now = performance.now();
  /* tilt left/right (gamma) → select string */
  if (dGamma > 5) {
    const mapped = Math.round(((gamma + 45) / 90) * (PENT.length - 1));
    const next = Math.max(0, Math.min(PENT.length - 1, mapped));
    if (next !== selectedIdx) {
      selectedIdx = next;
      highlightSelected();
    } else if (Math.abs(gamma - prevGamma) > 5) {
      moveSelect(gamma > prevGamma ? 1 : -1);
    }
  }

  /* Ring only selects string — pluck via touch / cane (真弹分工) */
  void now;
  void dBeta;
}

/* ===== Smart Cane (DeviceMotion) ===== */
let caneActive = false, caneFrame = 0, caneLastAccel = { x: 0, y: 0, z: 0 };
let caneCooldown = 0, caneSwingCooldown = 0;

function markCaneConnected() {
  const b = document.getElementById('cane-status');
  caneActive = true;
  b.className = 'active';
  b.textContent = '🦯 已连接';
  b.onclick = null;
  window.addEventListener('devicemotion', handleCane);
}

function setupCane() {
  if (typeof DeviceMotionEvent === 'undefined') return;
  if (caneActive) return;
  const b = document.getElementById('cane-status');
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    b.className = 'tap';
    b.textContent = '🦯 点击启用';
    b.onclick = async () => {
      try {
        const p = await DeviceMotionEvent.requestPermission();
        if (p === 'granted') markCaneConnected();
      } catch (_) { b.textContent = '🦯 不支持'; }
    };
  } else {
    markCaneConnected();
  }
}

function handleCane(e) {
  if (!caneActive || !playing) return;
  caneFrame++;
  if (caneFrame % 6 !== 0) return;
  const a = e.accelerationIncludingGravity || e.acceleration || { x: 0, y: 0, z: 0 };
  const ax = a.x || 0, ay = a.y || 0, az = a.z || 0;
  const dax = Math.abs(ax - caneLastAccel.x);
  const day = Math.abs(ay - caneLastAccel.y);
  const daz = Math.abs(az - caneLastAccel.z);
  const swingMag = Math.sqrt(ax * ax + ay * ay) - 9.8;
  caneLastAccel = { x: ax, y: ay, z: az };
  const now = performance.now();

  /* accel spike > 8 = tap → pluck */
  if ((dax > 8 || day > 8 || daz > 8) && now > caneCooldown) {
    caneCooldown = now + 300;
    pluckSelected(0.9);
    return;
  }
  /* swing > 3 = change string */
  if (Math.abs(swingMag) > 3 && now > caneSwingCooldown) {
    caneSwingCooldown = now + 220;
    moveSelect(ax > 0 ? 1 : -1);
  }
}

/* ===== Start / permissions ===== */
async function startPlay() {
  ensureAudio();
  playing = true;
  document.getElementById('onboard').classList.add('hidden');

  /* request sensors together when available (iOS) */
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      const p = await DeviceOrientationEvent.requestPermission();
      if (p === 'granted') markRingConnected();
    }
  } catch (_) {}
  try {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      const p = await DeviceMotionEvent.requestPermission();
      if (p === 'granted') markCaneConnected();
    }
  } catch (_) {}

  setupRing();
  setupCane();
}

document.getElementById('start-btn').addEventListener('click', startPlay);

buildUI();
window.addEventListener('resize', () => { /* layout is CSS-flex; re-highlight */ highlightSelected(); });
</script>
